name: Game settlement PostgreSQL concurrency

on:
  pull_request:
    paths:
      - '.github/workflows/game-settlement-concurrency.yml'
      - 'scripts/ci/game-settlement-concurrency.sh'
      - 'tests/sql/**'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/game-settlement-concurrency.yml'
      - 'scripts/ci/game-settlement-concurrency.sh'
      - 'tests/sql/**'
      - 'supabase/migrations/**'

# No production environment, deployment token, or repository write permissions.
permissions:
  contents: read

concurrency:
  group: game-settlement-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run native isolated scenarios three times
        run: bash scripts/ci/game-settlement-concurrency.sh
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-settlement-concurrency-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/game-settlement-native-postgres/
          if-no-files-found: error
          retention-days: 30
