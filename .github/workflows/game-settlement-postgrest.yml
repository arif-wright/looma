name: Game settlement PostgREST isolation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/game-settlement-postgrest.yml'
      - 'scripts/ci/game-settlement-postgrest.sh'
      - 'tests/sql/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/phase_9f_player_stats.sql'
      - 'src/lib/server/games/**'
      - 'src/lib/server/queries/getPlayerStats.ts'
      - 'src/routes/api/games/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/game-settlement-postgrest.yml'
      - 'scripts/ci/game-settlement-postgrest.sh'
      - 'tests/sql/**'
      - 'supabase/migrations/**'
      - 'supabase/sql/phase_9f_player_stats.sql'
      - 'src/lib/server/games/**'
      - 'src/lib/server/queries/getPlayerStats.ts'
      - 'src/routes/api/games/**'
permissions:
  contents: read
concurrency:
  group: game-postgrest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postgrest-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify real HTTP ownership and replay boundary
        run: bash scripts/ci/game-settlement-postgrest.sh
      - name: Preserve synthetic boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-settlement-postgrest-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/game-settlement-postgrest/
          if-no-files-found: error
          retention-days: 30
