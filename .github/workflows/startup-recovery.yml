name: Startup recovery verification

# Additive credential-free gate. Does not replace the broader recovery-release
# gate, and never deploys or contacts hosted authentication/database services.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: startup-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  startup-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify and record reviewed source and unchanged toolchain
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/startup-recovery
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD:src)" = 0c081ed35b76c5356b5b8853e7582516f7da05fd
          test "$(git rev-parse HEAD:supabase)" = 0a420e027ca5ff8038408d43072ece95c6333c8c
          test -z "${START_RECOVERY_BROWSER_EXECUTABLE:-}"
          {
            echo '306 focused units + 130 component-DOM cases + a separate 42-case synthetic-browser execution gate.'
            echo 'Real shells and SDK; synthetic Auth, transport and engines. No hosted backend, real engine, mobile coverage or deployment acceptance.'
            git rev-parse HEAD HEAD^{tree} HEAD:src HEAD:supabase
            node --version
            npm --version
            git ls-files -z src scripts/testing/recovery-dom scripts/testing/start-recovery-preview package.json package-lock.json pnpm-lock.yaml .github/workflows/startup-recovery.yml .github/workflows/recovery-release.yml | xargs -0 sha256sum
          } > artifacts/startup-recovery/source.txt
          node scripts/testing/recovery-dom/verify-playwright-toolchain.mjs candidate before "$PWD" "$PWD" > artifacts/startup-recovery/toolchain-before.json
      - name: Install the two locked dependency sets without lifecycle scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix scripts/testing/recovery-dom
          ./node_modules/.bin/svelte-kit sync
          node scripts/testing/recovery-dom/verify-playwright-toolchain.mjs candidate after "$PWD" "$PWD" > artifacts/startup-recovery/toolchain-after.json
      - name: Test the strict report verifier
        run: |
          set -euo pipefail
          node --test scripts/testing/recovery-dom/verify-start-recovery-results.test.mjs 2>&1 | tee artifacts/startup-recovery/verifier-tests.log
      - name: Run and verify all 306 focused session and startup unit cases
        env:
          VITEST: 'true'
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run src/lib/__tests__/gameSdkSessionLifecycle.spec.ts src/lib/__tests__/gameSdkStartRecovery.spec.ts src/lib/__tests__/gameIntegrationStartRecovery.spec.ts src/lib/__tests__/arpgBootStartRecovery.spec.ts src/lib/__tests__/arpgBootSceneReadiness.spec.ts src/lib/__tests__/arpgGameSceneReadiness.spec.ts src/lib/__tests__/gameFullscreenStartRecovery.spec.ts src/lib/__tests__/arpgExpedition.spec.ts src/lib/__tests__/arpgExpeditionScene.spec.ts src/lib/__tests__/arpgTownSession.spec.ts src/lib/__tests__/arpgTownCorner.spec.ts src/lib/__tests__/arpgTownPlaza.spec.ts src/lib/__tests__/arpgViewportLayout.spec.ts --pool=forks --poolOptions.forks.singleFork=true --retry=0 --allowOnly=false --reporter=default --reporter=json --outputFile=artifacts/startup-recovery/unit.json 2>&1 | tee artifacts/startup-recovery/unit.log
          node scripts/testing/recovery-dom/verify-start-recovery-results.mjs unit artifacts/startup-recovery/unit.json
      - name: Run and verify all 130 component-DOM cases
        run: |
          set -euo pipefail
          for suite in neon portal start legacy arpg-town; do
            report="$PWD/artifacts/startup-recovery/$suite-dom.json"
            node scripts/testing/recovery-dom/node_modules/vitest/vitest.mjs run --config "scripts/testing/recovery-dom/$suite.config.mjs" --retry=0 --allowOnly=false --reporter=default --reporter=json --outputFile="$report" 2>&1 | tee "artifacts/startup-recovery/$suite-dom.log"
            node scripts/testing/recovery-dom/verify-results.mjs "$suite" "$report"
            node scripts/testing/recovery-dom/verify-start-recovery-results.mjs "$suite" "$report"
          done
      - name: Prepare the unchanged browser fixture and verify discovery only
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)" bash scripts/testing/start-recovery-preview/verify-static.sh 2>&1 | tee artifacts/startup-recovery/preparation.log
          node scripts/testing/recovery-dom/verify-start-recovery-results.mjs discovery scripts/testing/start-recovery-preview/.results/discovery-results.json | tee artifacts/startup-recovery/discovery-verification.log
          test ! -e scripts/testing/start-recovery-preview/.results/browser-results.json
          node scripts/testing/recovery-dom/reproduce-clock-overlap.cjs "$PWD" | tee artifacts/startup-recovery/clock-control.json
      - name: Install only the locked Playwright-managed Chromium
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; import { readFileSync } from "node:fs"; import { createHash } from "node:crypto"; const executable=chromium.executablePath(); console.log(JSON.stringify({playwright:JSON.parse(readFileSync("node_modules/@playwright/test/package.json","utf8")).version, apiExecutableReference:executable, apiExecutableReferenceSha256:createHash("sha256").update(readFileSync(executable)).digest("hex"), headlessLaunchSelection:"Default headless Chromium is selected by Playwright 1.57.0 as chromium-headless-shell using the revision metadata below. The full Chromium API executable reference hash is not launched-process provenance.", browserRevisions:JSON.parse(readFileSync("node_modules/playwright-core/browsers.json","utf8")).browsers.filter(item=>item.name.startsWith("chromium"))},null,2));' > artifacts/startup-recovery/managed-browser-provenance.json
      - name: Execute all 42 synthetic browser cases once and validate actual results
        run: |
          set -euo pipefail
          test -z "${START_RECOVERY_BROWSER_EXECUTABLE:-}"
          test ! -e scripts/testing/start-recovery-preview/.results/browser-results.json
          node node_modules/@playwright/test/cli.js test --config scripts/testing/start-recovery-preview/playwright.config.ts 2>&1 | tee artifacts/startup-recovery/browser.log
          node scripts/testing/recovery-dom/verify-start-recovery-results.mjs execution scripts/testing/start-recovery-preview/.results/browser-results.json | tee artifacts/startup-recovery/execution-verification.log
          node scripts/testing/recovery-dom/verify-playwright-toolchain.mjs candidate after "$PWD" "$PWD" > artifacts/startup-recovery/toolchain-final.json
          git diff --exit-code -- src supabase static services package.json package-lock.json pnpm-lock.yaml scripts/testing/start-recovery-preview scripts/testing/recovery-dom
      - name: Gather available fixture evidence even when a check fails
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/startup-recovery/fixture
          if [ -d scripts/testing/start-recovery-preview/.results ]; then
            cp -a scripts/testing/start-recovery-preview/.results/. artifacts/startup-recovery/fixture/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          # Reports and screenshots stay small enough for bounded review. Keep
          # failure traces too, in their own artifact rather than dropping them.
          path: |
            artifacts/startup-recovery/
            !artifacts/startup-recovery/fixture/browser-artifacts/**/trace.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-recovery-traces-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/startup-recovery/fixture/browser-artifacts/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
