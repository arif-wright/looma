name: ARPG stationary frame gap diagnostic (not acceptance)

# Separate, credential-free diagnostic. A green collection job cannot satisfy
# or replace any existing 14-case acceptance result. No deploy or backend access.
on:
  pull_request:
    paths:
      - '.github/workflows/arpg-frame-gap.yml'
      - 'scripts/testing/arpg-readiness-preview/frame-gap*'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: arpg-frame-gap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  frame-gap-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify fixed published source and unchanged acceptance/toolchain
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/arpg-frame-gap
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD:src)" = 805e1fcc084b21e0dd97ee9f632a2aba326ef8f1
          test "$(git rev-parse HEAD:static)" = 4e73595fef84bde3a91c0d9d129eaa2969c7fe68
          test "$(git rev-parse HEAD:supabase)" = 0a420e027ca5ff8038408d43072ece95c6333c8c
          test -z "${ARPG_READINESS_BROWSER_EXECUTABLE:-}"
          test -z "${START_RECOVERY_BROWSER_EXECUTABLE:-}"
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 22) throw new Error("Use the approved Node 22 runtime.")'
          node scripts/testing/arpg-readiness-preview/frame-gap-source-guard.mjs
          node scripts/testing/recovery-dom/verify-playwright-toolchain.mjs candidate before "$PWD" "$PWD" > artifacts/arpg-frame-gap/toolchain-before.json
          {
            echo 'DIAGNOSTIC ONLY. Candidate always enabled; light versus detailed stationary brackets. No acceptance, input-route, deployment, real Auth/API/database/reward or mobile claim.'
            git rev-parse HEAD HEAD^{tree} HEAD:src HEAD:static HEAD:supabase
            node --version
            npm --version
            git ls-files -z src static scripts/testing/arpg-readiness-preview scripts/testing/recovery-dom/verify-playwright-toolchain.mjs package.json package-lock.json pnpm-lock.yaml .github/workflows/arpg-frame-gap.yml .github/workflows/arpg-scene-readiness.yml .github/workflows/arpg-prompt-timing.yml | xargs -0 sha256sum
          } > artifacts/arpg-frame-gap/source.txt
          node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({platform:os.platform(),release:os.release(),arch:os.arch(),cpuModel:os.cpus()[0]?.model,cpuCount:os.cpus().length,totalMemory:os.totalmem(),runnerOS:process.env.RUNNER_OS,runnerArch:process.env.RUNNER_ARCH,node:process.version},null,2));' > artifacts/arpg-frame-gap/runner-context.json
      - name: Install unchanged locked dependencies and validate diagnostic
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          ./node_modules/.bin/svelte-kit sync
          node scripts/testing/recovery-dom/verify-playwright-toolchain.mjs candidate after "$PWD" "$PWD" > artifacts/arpg-frame-gap/toolchain-after.json
          node node_modules/typescript/bin/tsc --noEmit -p scripts/testing/arpg-readiness-preview/tsconfig.json 2>&1 | tee artifacts/arpg-frame-gap/typescript.log
          node --test scripts/testing/arpg-readiness-preview/frame-gap*.test.mjs 2>&1 | tee artifacts/arpg-frame-gap/unit.log
          node scripts/testing/arpg-readiness-preview/frame-gap-source-guard.mjs
      - name: Build and record diagnostic discovery only
        run: |
          set -euo pipefail
          test ! -e scripts/testing/arpg-readiness-preview/.frame-gap-results/diagnostic-results.json
          node node_modules/vite/bin/vite.js build --config scripts/testing/arpg-readiness-preview/frame-gap.vite.config.mjs 2>&1 | tee artifacts/arpg-frame-gap/build.log
          node node_modules/@playwright/test/cli.js test --config scripts/testing/arpg-readiness-preview/frame-gap.playwright.config.ts --list 2>&1 | tee artifacts/arpg-frame-gap/discovery.log
          test ! -e scripts/testing/arpg-readiness-preview/.frame-gap-results/diagnostic-results.json
      - name: Install only locked Playwright-managed Chromium
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; import { readFileSync } from "node:fs"; import { createHash } from "node:crypto"; const executable=chromium.executablePath(); console.log(JSON.stringify({playwright:JSON.parse(readFileSync("node_modules/@playwright/test/package.json","utf8")).version, apiExecutableReference:executable, apiExecutableReferenceSha256:createHash("sha256").update(readFileSync(executable)).digest("hex"), headlessLaunchSelection:"Default headless Chromium from locked Playwright; full executable reference is not launched-process provenance.", browserRevisions:JSON.parse(readFileSync("node_modules/playwright-core/browsers.json","utf8")).browsers.filter(item=>item.name.startsWith("chromium"))},null,2));' > artifacts/arpg-frame-gap/managed-browser-provenance.json
      - name: Collect one bounded counterbalanced diagnostic
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test --config scripts/testing/arpg-readiness-preview/frame-gap.playwright.config.ts 2>&1 | tee artifacts/arpg-frame-gap/browser.log
          node scripts/testing/arpg-readiness-preview/frame-gap-report.mjs scripts/testing/arpg-readiness-preview/.frame-gap-results/diagnostic-results.json > artifacts/arpg-frame-gap/diagnostic-summary.json
          node scripts/testing/arpg-readiness-preview/frame-gap-source-guard.mjs
          node scripts/testing/recovery-dom/verify-playwright-toolchain.mjs candidate after "$PWD" "$PWD" > artifacts/arpg-frame-gap/toolchain-final.json
          git diff --exit-code -- src supabase static services package.json package-lock.json pnpm-lock.yaml scripts/testing/arpg-readiness-preview scripts/testing/recovery-dom .github/workflows
      - name: Preserve all available diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/arpg-frame-gap/fixture
          if [ -d scripts/testing/arpg-readiness-preview/.frame-gap-results ]; then
            cp -a scripts/testing/arpg-readiness-preview/.frame-gap-results/. artifacts/arpg-frame-gap/fixture/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arpg-frame-gap-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/arpg-frame-gap/
          if-no-files-found: error
          retention-days: 14
