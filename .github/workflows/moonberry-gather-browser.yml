name: Moonberry gather recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/game/**'
      - 'scripts/testing/moonberry-gather-preview/**'
      - 'static/game/**'
      - 'package*.json'
      - '.github/workflows/moonberry-gather-browser.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/game/**'
      - 'scripts/testing/moonberry-gather-preview/**'
      - 'static/game/**'
      - 'package*.json'
      - '.github/workflows/moonberry-gather-browser.yml'

permissions:
  contents: read
concurrency:
  group: moonberry-gather-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-client-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx svelte-kit sync
      - run: npx svelte-check --tsconfig scripts/testing/moonberry-gather-preview/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - name: Record local synthetic verification boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/moonberry-gather
          {
            echo 'Actual UI, session, connection and both renderers; synthetic SDK/tickets only.'
            echo 'No real account, application socket, reward, database, inventory load or deployment.'
            git rev-parse HEAD HEAD^{tree}
            node --version
            npx playwright --version
            git ls-files -z src/lib/game scripts/testing/moonberry-gather-preview package.json package-lock.json | xargs -0 sha256sum
          } > artifacts/moonberry-gather/source.txt
      - name: Exercise keyboard, touch, timeout, reconnect and teardown
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config scripts/testing/moonberry-gather-preview/playwright.config.ts 2>&1 | tee artifacts/moonberry-gather/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: moonberry-gather-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/moonberry-gather/*.txt
            artifacts/moonberry-gather/*.log
            artifacts/moonberry-gather/*.json
            artifacts/moonberry-gather/browser/**/*.png
            artifacts/moonberry-gather/browser/**/error-context.md
          if-no-files-found: error
          retention-days: 14
