<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected Wilds local presentation fixture</title><style>body{margin:0;background:#122725;color:#e7efdc;font-family:system-ui}header{padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:13px}button{border:1px solid #779078;background:#28443d;border-radius:10px;color:inherit;padding:9px 15px;cursor:pointer}#world{width:100%;max-width:1152px;aspect-ratio:16/9;margin:auto}p{padding:0 24px;font-size:13px}canvas{display:block}</style><header><strong>The Wilds</strong><span>Local presentation fixture · simulated snapshots</span><button id="grove">Moonberry Grove</button><button id="hollow">Lantern Hollow</button></header><div id="world"></div><p>WASD / arrows to move. Resident and companion positions in this fixture are synthetic. No account, server or rewards are connected.</p><script type="module">
import Phaser from 'phaser';
import { WorldScene } from '/src/lib/game/WorldScene.ts';
const touch={x:0,y:0};const scene=new WorldScene(touch);
const game=new Phaser.Game({type:Phaser.AUTO,parent:'world',width:960,height:540,backgroundColor:'#17382e',antialias:true,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:960,height:540},scene:[scene]});
let mapId='wilds-exploration',revision=0; let x=440,y=270; let tick=0;
const player={connected:true,acknowledgedSequence:0,colorIndex:0,displayName:'Explorer',handle:'fixture',playerBody:'female',companionPresent:true,companionName:'Muse',companionKind:'muse',companionStatus:'idle',companionRevision:1};
function snapshot(){return {localPlayerId:'local',tick,players:new Map([['local',{...player,mapId,x,y,transitionRevision:revision}],['other',{...player,mapId,x:525,y:292,displayName:'Ellis',playerBody:'male',companionPresent:false}],['hidden',{...player,mapId:mapId==='wilds-town'?'wilds-exploration':'wilds-town',x:400,y:300,displayName:'Wrong area'}]]),npcs:new Map([['resident',{id:'resident',mapId,name:mapId==='wilds-town'?'Wren':'Rowan',kind:'resident',playerBody:mapId==='wilds-town'?'female':'male',x:650+Math.sin(tick/15)*45,y:305+Math.cos(tick/15)*20,moving:true}],['hidden-npc',{id:'hidden-npc',mapId:mapId==='wilds-town'?'wilds-exploration':'wilds-town',name:'Wrong area',kind:'resident',playerBody:'male',x:520,y:330,moving:false}]])}}
scene.setConnectionActive(true);scene.applyNetworkSnapshot(snapshot());
scene.setMovementSender(()=>{});scene.setPortalHandlers(()=>{mapId=mapId==='wilds-town'?'wilds-exploration':'wilds-town';revision++;x=mapId==='wilds-town'?160:804;y=270;scene.applyNetworkSnapshot(snapshot())},()=>{});
for(const [id,map] of [['grove','wilds-exploration'],['hollow','wilds-town']])document.getElementById(id).onclick=()=>{mapId=map;revision++;x=440;y=270;scene.applyNetworkSnapshot(snapshot())};
const timer=setInterval(()=>{const canvas=game.canvas;if(canvas?.dataset.localPlayerX){x=Number(canvas.dataset.localPlayerX);y=Number(canvas.dataset.localPlayerY);tick++;scene.applyNetworkSnapshot(snapshot());}},100);
window.addEventListener('pagehide',()=>{clearInterval(timer);game.destroy(true)},{once:true});
window.__WILDS_FIXTURE__={game,scene,touch,snapshot,putLocal:(nextX,nextY)=>{x=nextX;y=nextY;revision++;scene.applyNetworkSnapshot(snapshot())},apply:(s)=>scene.applyNetworkSnapshot(s),switchArea:(id)=>document.getElementById(id).click()};
</script></html>
