    <g transform="translate(0 1536)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">W</text><text class="d" x="384" y="244" text-anchor="middle">W</text></g>
    <g transform="translate(0 1792)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">NW</text><text class="d" x="384" y="244" text-anchor="middle">NW</text></g>
  </g>
