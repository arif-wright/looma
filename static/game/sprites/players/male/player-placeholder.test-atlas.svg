<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="4096" viewBox="0 0 1024 4096">
  <!-- TEMPORARY directional player silhouette. This is not a Memvoya player design. -->
  <defs>
    <g id="player">
      <circle cx="64" cy="48" r="27" fill="#d9f8f2" stroke="#173b48" stroke-width="6"/>
      <path d="M30 143 Q34 75 64 75 Q94 75 98 143 L111 181 L17 181 Z" fill="#3cc8ae" stroke="#173b48" stroke-width="7" stroke-linejoin="round"/>
      <path d="M64 8 L49 31 H79 Z" fill="#fff4ae" stroke="#173b48" stroke-width="4"/>
      <path d="M43 180 L40 202 M85 180 L88 202" stroke="#173b48" stroke-width="10" stroke-linecap="round"/>
      <rect x="38" y="112" width="52" height="27" rx="10" fill="#173b48"/><text x="64" y="132" text-anchor="middle" font-size="17" fill="#fff">TEMP</text>
    </g>
    <style>.d{font-family:system-ui,sans-serif;font-weight:900;font-size:25px;fill:#fff;paint-order:stroke;stroke:#173b48;stroke-width:6px}</style>
  </defs>
  <rect width="1024" height="4096" fill="none"/>
  <!-- Native direction rows. Idle uses columns 0–1; walk uses 0–3. -->
  <g id="idleRows">
    <g transform="translate(0 0)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">N</text><text class="d" x="384" y="244" text-anchor="middle">N</text></g>
    <g transform="translate(0 256)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">NE</text><text class="d" x="384" y="244" text-anchor="middle">NE</text></g>
    <g transform="translate(0 512)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">E</text><text class="d" x="384" y="244" text-anchor="middle">E</text></g>
    <g transform="translate(0 768)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">SE</text><text class="d" x="384" y="244" text-anchor="middle">SE</text></g>
    <g transform="translate(0 1024)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="19"/><text class="d" x="128" y="244" text-anchor="middle">S</text><text class="d" x="384" y="244" text-anchor="middle">S</text></g>
