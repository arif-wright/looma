    <g transform="translate(0 3072)"><use href="#player" x="64" y="22"/><use href="#player" x="320" y="14"/><use href="#player" x="576" y="22"/><use href="#player" x="832" y="28"/><text class="d" x="128" y="244" text-anchor="middle">S</text><text class="d" x="384" y="244" text-anchor="middle">S</text><text class="d" x="640" y="244" text-anchor="middle">S</text><text class="d" x="896" y="244" text-anchor="middle">S</text></g>
